name: Create or Deploy LiveKit Agent (manual)

on:
  workflow_dispatch:
    inputs:
      operation:
        description: 'First time ever: pick "create". After that: pick "deploy".'
        required: true
        type: choice
        options:
          - create
          - deploy
        default: 'create'

jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: read
    steps:
      - uses: actions/checkout@v4

      - name: Run LiveKit Cloud Agent operation
        uses: livekit/deploy-action@v2
        env:
          LIVEKIT_URL: ${{ secrets.LIVEKIT_URL }}
          LIVEKIT_API_KEY: ${{ secrets.LIVEKIT_API_KEY }}
          LIVEKIT_API_SECRET: ${{ secrets.LIVEKIT_API_SECRET }}
          SECRET_LIST: ${{ secrets.SECRET_LIST }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          OPERATION: ${{ github.event.inputs.operation }}
          WORKING_DIRECTORY: .
